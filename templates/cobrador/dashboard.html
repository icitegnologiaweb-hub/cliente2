<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#18181b">
<link rel="manifest" href="{{ url_for('static', filename='manifest.json') }}">
<link rel="apple-touch-icon" href="{{ url_for('static', filename='img/logo_cobros.svg') }}">
<title>Rutas disponibles</title>

<link href="{{ url_for('static', filename='css/output.css') }}" rel="stylesheet">
<link href="{{ url_for('static', filename='css/theme.css') }}" rel="stylesheet">

<style>
body {
    background:
        radial-gradient(circle at 18% -10%, rgba(249,115,22,.2), transparent 30%),
        linear-gradient(180deg, #18181b 0%, #0f172a 58%, #f4f4f5 58%, #f4f4f5 100%);
    min-height: 100vh;
}

.header-card {
    background: rgba(255,255,255,.94);
    border-radius: 18px;
    box-shadow: 0 18px 38px rgba(24,24,27,.12);
    color: #18181b;
}

.card-ruta {
    background: rgba(255,255,255,.96);
    border-radius: 18px;
    box-shadow: 0 18px 38px rgba(24,24,27,.12);
    border: 1px solid rgba(24,24,27,.08);
    color: #18181b;
    transition: all .25s ease;
}

.card-ruta:hover {
    transform: translateY(-3px);
    box-shadow:
        inset 0 0 0 1px rgba(255,255,255,.08),
        0 18px 30px rgba(0,0,0,.5);
}

.card-icon {
    background: linear-gradient(135deg, #f97316, #06b6d4);
    box-shadow: 0 10px 22px rgba(249,115,22,.24);
}

.logo-glow {
    filter: drop-shadow(0 0 12px rgb(255, 255, 255));
}
</style>
</head>

<body class="text-white mobile-page">

<div class="max-w-md mx-auto p-4">

    <!-- Header -->
    <div class="header-card px-5 py-4 mb-6 flex justify-between items-center">
        <h2 class="text-lg font-semibold tracking-wide">
            Rutas disponibles
        </h2>

        <a href="{{ url_for('login_app') }}" class="opacity-80 hover:opacity-100 transition text-lg">
            ⎋
        </a>
    </div>

    <!-- Logo -->
    <div class="logo-card flex justify-center mb-10">
        <img src="{{ url_for('static', filename='img/logo_cobros.svg') }}"
             alt="Gestion de Cobros"
             class="h-16 logo-glow">
    </div>

    <!-- Lista -->
    <div class="space-y-5">

        {% if rutas %}

            {% for ruta in rutas %}

            <a href="{{ url_for('bienvenida_ruta', ruta_id=ruta.id) }}"
               class="block card-ruta px-5 py-4">

                <div class="flex items-center justify-between">

                    <div class="flex items-center gap-4">
                        <div class="h-11 w-11 rounded-full flex items-center justify-center card-icon">
                            🏍
                        </div>

                        <div>
                            <div class="text-sm font-semibold tracking-wide">
                                {{ ruta.codigo }}
                            </div>
                            <div class="text-xs opacity-70 mt-0.5">
                                {{ ruta.nombre }}
                            </div>
                        </div>
                    </div>

                    <span class="text-blue-400 text-xl opacity-80">
                        ›
                    </span>

                </div>

            </a>

            {% endfor %}

        {% else %}

            <div class="text-center opacity-60 text-sm mt-20">
                No tienes rutas asignadas
            </div>

        {% endif %}

    </div>

</div>

</body>
</html>
