<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Acceso de Ruta</title>
<link href="{{ url_for('static', filename='css/output.css') }}" rel="stylesheet">

<style>
:root {
    --brand-ink: #062f2b;
    --brand-dark: #064e3b;
    --brand-main: #0f766e;
    --brand-accent: #d97706;
}

body {
    min-height: 100vh;
    background:
        radial-gradient(circle at top left, rgba(20,184,166,.32), transparent 32%),
        radial-gradient(circle at bottom right, rgba(217,119,6,.22), transparent 30%),
        linear-gradient(160deg, #062f2b 0%, #031f1c 100%);
}

.mobile-shell {
    width: 100%;
    max-width: 430px;
    min-height: 100vh;
    margin: 0 auto;
    padding: 22px 18px;
    display: flex;
    align-items: center;
}

.login-card {
    position: relative;
    width: 100%;
    overflow: hidden;
    border-radius: 32px;
    padding: 32px 26px;
    background: rgba(255,255,255,.96);
    border: 1px solid rgba(255,255,255,.72);
    box-shadow: 0 28px 70px rgba(0,0,0,.26);
}

.login-card::before {
    content: "";
    position: absolute;
    inset: 0 0 auto 0;
    height: 7px;
    background: linear-gradient(90deg, var(--brand-main), var(--brand-accent));
}

.brand-mark {
    width: 66px;
    height: 66px;
    border-radius: 24px;
    display: grid;
    place-items: center;
    color: white;
    background: linear-gradient(135deg, var(--brand-main), var(--brand-accent));
    box-shadow: 0 16px 34px rgba(15,118,110,.28);
}

.form-control-custom {
    border: 1px solid #dbe7e3;
    border-radius: 18px;
    padding: 16px;
    font-size: 16px;
    background: #f7fbfa;
    transition: .22s;
    color: #10231f;
}

.form-control-custom:focus {
    border-color: var(--brand-main);
    box-shadow: 0 0 0 4px rgba(20,184,166,.18);
    background: white;
    outline: none;
}

.btn-primary-custom {
    background: linear-gradient(135deg, var(--brand-main), var(--brand-accent));
    border-radius: 18px;
    padding: 16px;
    font-size: 16px;
    font-weight: 700;
    transition: .22s;
    box-shadow: 0 14px 28px rgba(15,118,110,.28);
}

.btn-primary-custom:active {
    transform: scale(.98);
}
</style>
</head>

<body>
<main class="mobile-shell">
    <section class="login-card">
        <div class="flex items-start justify-between gap-4">
            <div class="brand-mark">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-8 w-8" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8" d="M5 18h14M7 18V9l5-4 5 4v9" />
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8" d="M9 18v-5h6v5" />
                </svg>
            </div>

            <div class="rounded-full bg-teal-50 px-3 py-1 text-xs font-bold text-teal-700 border border-teal-100">
                Ruta
            </div>
        </div>

        <div class="mt-7">
            <h1 class="text-3xl font-black text-slate-900">
                Acceso de ruta
            </h1>
            <p class="mt-2 text-sm text-slate-500">
                Consulta tus clientes, recaudos y movimientos del día.
            </p>
        </div>

        <form method="POST" class="mt-8 space-y-5" autocomplete="on">
            <div>
                <label class="block text-sm mb-2 font-medium text-slate-600">
                    Correo electrónico
                </label>
                <input type="email"
                       name="email"
                       required
                       autocomplete="username"
                       class="w-full form-control-custom">
            </div>

            <div class="relative">
                <label class="block text-sm mb-2 font-medium text-slate-600">
                    Contraseña
                </label>

                <input
                    type="password"
                    name="password"
                    id="password"
                    required
                    autocomplete="current-password"
                    class="w-full form-control-custom pr-12">

                <button
                    type="button"
                    onclick="togglePassword()"
                    class="absolute right-4 top-[45px] text-slate-400 hover:text-teal-700 transition"
                    aria-label="Mostrar u ocultar contraseña">
                    <svg id="eyeClosed" xmlns="http://www.w3.org/2000/svg"
                        class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                        d="M13.875 18.825A10.05 10.05 0 0112 19c-5 0-9-7-9-7a17.1 17.1 0 012.805-3.565M6.18 6.18A9.953 9.953 0 0112 5c5 0 9 7 9 7a16.978 16.978 0 01-4.043 4.943M15 12a3 3 0 11-6 0 3 3 0 016 0zm6 6L3 3" />
                    </svg>

                    <svg id="eyeOpen" xmlns="http://www.w3.org/2000/svg"
                        class="h-5 w-5 hidden" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                        d="M15 12a3 3 0 11-6 0 3 3 0 016 0zm7.938 0C21.729 14.943 17.74 18 12 18c-5.74 0-9.729-3.057-10.938-6C2.271 9.057 6.26 6 12 6c5.74 0 9.729 3.057 10.938 6z" />
                    </svg>
                </button>
            </div>

            <label class="flex items-center gap-2 cursor-pointer text-sm text-slate-600">
                <input type="checkbox" name="recordar" class="rounded border-slate-300 text-teal-700 focus:ring-teal-600">
                <span>Guardar sesión</span>
            </label>

            <button type="submit" class="w-full text-white btn-primary-custom">
                Ingresar
            </button>

            {% if error %}
            <div class="bg-red-50 text-red-600 border border-red-100 text-sm p-3 rounded-xl text-center">
                {{ error }}
            </div>
            {% endif %}
        </form>
    </section>
</main>

<script>
function togglePassword(){
    const passwordInput=document.getElementById("password");
    const eyeOpen=document.getElementById("eyeOpen");
    const eyeClosed=document.getElementById("eyeClosed");

    if(passwordInput.type==="password"){
        passwordInput.type="text";
        eyeOpen.classList.remove("hidden");
        eyeClosed.classList.add("hidden");
    }else{
        passwordInput.type="password";
        eyeOpen.classList.add("hidden");
        eyeClosed.classList.remove("hidden");
    }
}
</script>
</body>
</html>
