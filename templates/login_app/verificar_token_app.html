<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Verificar Código</title>
<link href="{{ url_for('static', filename='css/output.css') }}" rel="stylesheet">

<style>
body {
    min-height: 100vh;
    background:
        radial-gradient(circle at top left, rgba(20,184,166,.32), transparent 32%),
        radial-gradient(circle at bottom right, rgba(217,119,6,.22), transparent 30%),
        linear-gradient(160deg, #062f2b 0%, #031f1c 100%);
}

.mobile-shell {
    width: 100%;
    max-width: 430px;
    min-height: 100vh;
    margin: 0 auto;
    padding: 22px 18px;
    display: flex;
    align-items: center;
}

.token-card {
    width: 100%;
    border-radius: 32px;
    padding: 32px 26px;
    background: rgba(255,255,255,.96);
    border: 1px solid rgba(255,255,255,.72);
    box-shadow: 0 28px 70px rgba(0,0,0,.26);
}

.brand-mark {
    width: 64px;
    height: 64px;
    border-radius: 24px;
    display: grid;
    place-items: center;
    color: white;
    background: linear-gradient(135deg, #0f766e, #d97706);
    box-shadow: 0 16px 34px rgba(15,118,110,.28);
}

.token-input {
    width: 100%;
    border: 1px solid #dbe7e3;
    border-radius: 18px;
    padding: 16px;
    background: #f7fbfa;
    text-align: center;
    font-size: 24px;
    letter-spacing: .35em;
    font-weight: 800;
}

.token-input:focus {
    border-color: #0f766e;
    box-shadow: 0 0 0 4px rgba(20,184,166,.18);
    background: white;
    outline: none;
}
</style>
</head>

<body>
<main class="mobile-shell">
    <section class="token-card">
        <div class="brand-mark mx-auto">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-8 w-8" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2z" />
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8" d="M8 11V8a4 4 0 018 0v3" />
            </svg>
        </div>

        <h1 class="text-2xl font-black text-center mt-6 text-slate-900">
            Verificación de acceso
        </h1>
        <p class="text-sm text-slate-500 text-center mt-2 mb-8">
            Ingresa el código enviado para continuar.
        </p>

        <form method="POST" class="space-y-5">
            <div>
                <label class="block text-sm mb-2 font-medium text-slate-600">
                    Código de verificación
                </label>
                <input type="text"
                       name="token"
                       maxlength="6"
                       required
                       class="token-input"
                       placeholder="000000">
            </div>

            <button type="submit"
                class="w-full bg-gradient-to-r from-teal-700 to-amber-600 text-white p-4 rounded-2xl font-bold transition active:scale-[0.98]">
                Validar código
            </button>

            {% with messages = get_flashed_messages(with_categories=true) %}
                {% if messages %}
                    {% for category, message in messages %}
                        <div class="text-sm text-center mt-4
                            {% if category == 'error' %} text-red-500 {% else %} text-green-600 {% endif %}">
                            {{ message }}
                        </div>
                    {% endfor %}
                {% endif %}
            {% endwith %}
        </form>
    </section>
</main>
</body>
</html>
